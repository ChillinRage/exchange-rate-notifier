name: Deploy AWS Lambda

on:
  push:
    branches: 
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC authentication
      contents: read  # check out repository
    steps:
      - uses: actions/checkout@v4

      - name: Get GitHub account and repository IDs
        run: |
          echo "Account ID:"
          gh api /users/${{ github.repository_owner }} --jq .id

          echo "Repository ID:"
          gh api /repos/${{ github.repository }} --jq .id
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::583763656478:role/github-exchange-rate-notifier
          aws-region: ap-southeast-1

      - name: Deploy Lambda Function
        uses: aws-actions/aws-lambda-deploy@v1
        with:
          function-name: jpy-exchange-rate
          code-artifacts-dir: ./dist
